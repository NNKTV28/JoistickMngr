name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Read version from Cargo.toml
        id: version
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: ./scripts/prepare-signing-certificate.ps1

      - name: Sign application
        shell: pwsh
        run: ./scripts/sign-file.ps1 -FilePath target/release/PerifeMngr.exe

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build signed installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version ${{ steps.version.outputs.value }}

      # Versions released before the rename look for this name when they update themselves.
      - name: Add installer copy for versions before the rename
        shell: pwsh
        run: Copy-Item "dist/PerifeMngr-Setup-${{ steps.version.outputs.value }}.exe" "dist/JoystickManager-Setup-${{ steps.version.outputs.value }}.exe"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: PerifeMngr-Setup-${{ steps.version.outputs.value }}
          path: dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
