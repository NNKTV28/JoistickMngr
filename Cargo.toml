[package]
name = "joystick-manager"
version = "0.5.0"
edition = "2024"
description = "Manage Logitech X56 HOTAS and Saitek rudder pedals on Windows"
authors = ["NNKtv28 <support@nikicoding.com>"]
homepage = "https://nikicoding.com"
repository = "https://github.com/NNKTV28/JoistickMngr"
license = "MIT"

[[bin]]
name = "JoystickManager"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts"] }
hidapi = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.9"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
sysinfo = "0.39"
tray-icon = "0.26"
ureq = { version = "3", features = ["json"] }
vigem-client = { version = "0.1.4", features = ["unstable_ds4"] }
windows = { version = "0.62", features = [
    "Win32_Devices_HumanInterfaceDevice",
    "Foundation",
    "Win32_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Media",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_UpdateAgent",
    "Win32_System_Variant",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"
wmi = "0.18"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
